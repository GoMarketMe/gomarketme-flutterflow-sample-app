name: gomarketme_flutterflow_sample_app
description: A FlutterFlow-friendly sample app for the GoMarketMe Flutter SDK 5.0.5.
publish_to: 'none'
version: 5.0.5+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  gomarketme: 5.0.5
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1

  # FlutterFlow-generated projects usually include this package.
  # It is kept here so the sample can be copied into a FlutterFlow codebase easily.
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
