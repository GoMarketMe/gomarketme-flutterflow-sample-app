plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'co.gomarketme.flutter_sample_app'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'co.gomarketme.flutter_sample_app'
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName '6.0.0'
    }
}

flutter {
    source '../..'
}
