plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'co.gomarketme.flutter_sample_app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'co.gomarketme.flutter_sample_app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '5.0.5'
    }
}

flutter {
    source '../..'
}
